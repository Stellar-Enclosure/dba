rule_files:
  - cnpg-pg-a.rules.yaml
  - recovery-evidence.rules.yaml
evaluation_interval: 30s
tests:
  - name: 一个主实例时不触发主数量异常
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1"}'
        values: '0+0x5'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2"}'
        values: '1+0x5'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DbaPostgresObservedPrimaryCount
        exp_alerts: []
  - name: 监控没有主实例时在持续时间后触发
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2"}'
        values: '1+0x5'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DbaPostgresObservedPrimaryCount
        exp_alerts:
          - exp_labels:
              dba_cluster: pg-a
              severity: critical
            exp_annotations:
              summary: 监控观测到的主实例数不是一个
              description: 检查采集链、Lease、实际写主和旧主隔离；此告警不等于独立的客户端写入探测。
  - name: 主库的槽积压告警不将备库自身的槽误判为主库积压
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1"}'
        values: '0+0x10'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2"}'
        values: '1+0x10'
      - series: 'cnpg_pg_replication_slots_pg_wal_lsn_diff{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",slot_name="slot_a",slot_type="physical"}'
        values: '3500000000+0x10'
      - series: 'cnpg_pg_replication_slots_pg_wal_lsn_diff{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",slot_name="slot_b",slot_type="physical"}'
        values: '3500000000+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DbaPostgresSlotLagHigh
        exp_alerts:
          - exp_labels:
              job: cnpg-postgres
              namespace: dba-a
              cluster: pg-a
              pod: pg-a-1
              slot_name: slot_a
              slot_type: physical
              dba_cluster: pg-a
              severity: warning
            exp_annotations:
              summary: 主库复制槽保留距离超过 3 GiB
              description: 示例对应 4GB 槽预算；先查槽所有者、消费进度和磁盘，再按运行手册处置。
  - name: 备份指标缺失不能显示为健康
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: DbaPostgresBackupMetricsAbsent
        exp_alerts:
          - exp_labels:
              job: cnpg-postgres
              namespace: dba-a
              cluster: pg-a
              dba_cluster: pg-a
              severity: critical
            exp_annotations:
              summary: Barman 备份指标缺失
              description: 检查插件、侧车、ObjectStore 和 Prometheus 采集，无法据此确认备份健康。
  - name: 无实际同步备节点时触发告警
    interval: 1m
    input_series:
      - series: 'cnpg_dba_sync_eligible_replicas{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DbaPostgresNoSynchronousReplica
        exp_alerts:
          - exp_labels:
              job: cnpg-postgres
              namespace: dba-a
              cluster: pg-a
              pod: pg-a-1
              dba_cluster: pg-a
              severity: critical
            exp_annotations:
              summary: 主库没有可确认的同步备节点
              description: 核对复制和提交等待；不得为消除告警擅自降级同步要求。
  - name: 其他集群的槽积压不能触发本集群告警
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-b",cluster="pg-b",pod="pg-b-1"}'
        values: '0+0x10'
      - series: 'cnpg_pg_replication_slots_pg_wal_lsn_diff{job="cnpg-postgres",namespace="dba-b",cluster="pg-b",pod="pg-b-1",slot_name="slot_b",slot_type="physical"}'
        values: '3500000000+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DbaPostgresSlotLagHigh
        exp_alerts: []
  - name: 缺少独立恢复点证据必须告警
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: DbaDrRecoveryPointMissing
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              site: dr-a
              dba_cluster: pg-a
              severity: critical
            exp_annotations:
              summary: 独立站点恢复点证据缺失
              description: 核对证据采集和恢复链；没有数据时不能报告灾备健康。
  - name: 独立恢复点持续更新时不触发过期告警
    interval: 1m
    input_series:
      - series: 'dba_verified_recovery_point_timestamp_seconds{namespace="dba-a",cluster="pg-a",site="dr-a"}'
        values: '0+60x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: DbaDrRecoveryPointStale
        exp_alerts: []
