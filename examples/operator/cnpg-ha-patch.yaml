# 对已核验的 CNPG 1.30.1 官方 Deployment 做 Kustomize strategic merge。
# 这是补丁，不可单独 kubectl apply；资源值和节点标签须按目标平台确认。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-controller-manager
  namespace: cnpg-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      nodeSelector:
        dba.example/operator-eligible: 'true'
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudnative-pg
              topologyKey: kubernetes.io/hostname
      containers:
        - name: manager
          env:
            - name: CLUSTERS_ROLLOUT_DELAY
              value: '120'
            - name: INSTANCES_ROLLOUT_DELAY
              value: '30'
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
