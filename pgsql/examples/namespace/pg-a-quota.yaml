# 首次创建专用 Namespace 后使用；数值仅供容量演练，必须按多集群峰值重新计算。
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pg-a-budget
  namespace: dba-a
spec:
  hard:
    requests.cpu: '8'
    requests.memory: 16Gi
    requests.storage: 100Gi
    persistentvolumeclaims: '12'
    pods: '12'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: pg-a-container-defaults
  namespace: dba-a
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: '1'
        memory: 1Gi
