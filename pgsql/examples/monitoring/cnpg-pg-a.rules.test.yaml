rule_files:
  - cnpg-pg-a.rules.yaml
  - recovery-evidence.rules.yaml
  - service-evidence.rules.yaml
evaluation_interval: 30s
tests:
  - name: 一个主实例时不触发主数量异常
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1"}'
        values: '0+0x5'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2"}'
        values: '1+0x5'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DbaPostgresObservedPrimaryCount
        exp_alerts: []
  - name: 监控没有主实例时在持续时间后触发
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2"}'
        values: '1+0x5'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DbaPostgresObservedPrimaryCount
        exp_alerts:
          - exp_labels:
              dba_cluster: pg-a
              severity: critical
            exp_annotations:
              summary: 监控观测到的主实例数不是一个
              description: 检查采集链、Lease、实际写主和旧主隔离；此告警不等于独立的客户端写入探测。
  - name: 主库的槽积压告警不将备库自身的槽误判为主库积压
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1"}'
        values: '0+0x10'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2"}'
        values: '1+0x10'
      - series: 'cnpg_pg_replication_slots_pg_wal_lsn_diff{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",slot_name="slot_a",slot_type="physical"}'
        values: '3500000000+0x10'
      - series: 'cnpg_pg_replication_slots_pg_wal_lsn_diff{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",slot_name="slot_b",slot_type="physical"}'
        values: '3500000000+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DbaPostgresSlotLagHigh
        exp_alerts:
          - exp_labels:
              job: cnpg-postgres
              namespace: dba-a
              cluster: pg-a
              pod: pg-a-1
              slot_name: slot_a
              slot_type: physical
              dba_cluster: pg-a
              severity: warning
            exp_annotations:
              summary: 主库复制槽保留距离超过 3 GiB
              description: 示例对应 4GB 槽预算；先查槽所有者、消费进度和磁盘，再按运行手册处置。
  - name: 备份指标缺失不能显示为健康
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: DbaPostgresBackupMetricsAbsent
        exp_alerts:
          - exp_labels:
              job: cnpg-postgres
              namespace: dba-a
              cluster: pg-a
              dba_cluster: pg-a
              severity: critical
            exp_annotations:
              summary: Barman 备份指标缺失
              description: 检查插件、侧车、ObjectStore 和 Prometheus 采集，无法据此确认备份健康。
  - name: 无实际同步备节点时触发告警
    interval: 1m
    input_series:
      - series: 'cnpg_dba_sync_eligible_replicas{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DbaPostgresNoSynchronousReplica
        exp_alerts:
          - exp_labels:
              job: cnpg-postgres
              namespace: dba-a
              cluster: pg-a
              pod: pg-a-1
              dba_cluster: pg-a
              severity: critical
            exp_annotations:
              summary: 主库没有可确认的同步备节点
              description: 核对复制和提交等待；不得为消除告警擅自降级同步要求。
  - name: 其他集群的槽积压不能触发本集群告警
    interval: 1m
    input_series:
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-b",cluster="pg-b",pod="pg-b-1"}'
        values: '0+0x10'
      - series: 'cnpg_pg_replication_slots_pg_wal_lsn_diff{job="cnpg-postgres",namespace="dba-b",cluster="pg-b",pod="pg-b-1",slot_name="slot_b",slot_type="physical"}'
        values: '3500000000+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: DbaPostgresSlotLagHigh
        exp_alerts: []
  - name: 缺少独立恢复点证据必须告警
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: DbaDrRecoveryPointMissing
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              site: dr-a
              dba_cluster: pg-a
              severity: critical
            exp_annotations:
              summary: 独立站点恢复点证据缺失
              description: 核对证据采集和恢复链；没有数据时不能报告灾备健康。
  - name: 独立恢复点持续更新时不触发过期告警
    interval: 1m
    input_series:
      - series: 'dba_verified_recovery_point_timestamp_seconds{namespace="dba-a",cluster="pg-a",site="dr-a"}'
        values: '1+60x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: DbaDrRecoveryPointStale
        exp_alerts: []
  - name: 三实例正常且 KSM 双副本不重复计数
    interval: 1m
    input_series:
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance",instance="ksm-2"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",condition="true",instance="ksm-2"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance",instance="ksm-2"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",condition="true",instance="ksm-2"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance",instance="ksm-2"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",condition="true",instance="ksm-2"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '0+0x12'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",uid="uid-2"}'
        values: '1+0x12'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",uid="uid-2"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3",uid="uid-3"}'
        values: '1+0x12'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3",uid="uid-3"}'
        values: '1+0x12'
      - series: 'cnpg_dba_sync_eligible_replicas{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaPostgresReadyInstancesBelowExpected
        exp_alerts: []
      - eval_time: 5m
        alertname: DbaPostgresInstanceMetricsMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: DbaPostgresInstanceInventoryAbsent
        exp_alerts: []
    promql_expr_test:
      - expr: dba_postgres_ready_instances
        eval_time: 5m
        exp_samples:
          - labels: dba_postgres_ready_instances{namespace="dba-a",cluster="pg-a"}
            value: 3
  - name: 单备库退出发现但另一同步备库正常仍须逐实例告警
    interval: 1m
    input_series:
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",condition="true"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '0+0x12'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",uid="uid-2"}'
        values: '1+0x12'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",uid="uid-2"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3",uid="uid-3"}'
        values: '1 1 stale'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3",uid="uid-3"}'
        values: '1 1 stale'
      - series: 'cnpg_dba_sync_eligible_replicas{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaPostgresInstanceMetricsMissing
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              pod: pg-a-3
              uid: uid-3
              severity: warning
              dba_cluster: pg-a
            exp_annotations: &id001
              summary: PostgreSQL 单实例指标缺失
              description: 对照独立 Pod 清单检查实例及服务发现；up=0 和整集群缺失规则不能覆盖单个已移除目标。
      - eval_time: 5m
        alertname: DbaPostgresReadyInstancesBelowExpected
        exp_alerts: []
      - eval_time: 5m
        alertname: DbaPostgresScrapeDown
        exp_alerts: []
      - eval_time: 5m
        alertname: DbaPostgresNoSynchronousReplica
        exp_alerts: []
      - eval_time: 5m
        alertname: DbaPostgresMetricsAbsent
        exp_alerts: []
  - name: 单备库不 Ready 且退出发现须报告副本不足
    interval: 1m
    input_series:
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",condition="true"}'
        values: '1 1 0+0x10'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '0+0x12'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",uid="uid-2"}'
        values: '1+0x12'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",uid="uid-2"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3",uid="uid-3"}'
        values: '1 1 stale'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3",uid="uid-3"}'
        values: '1 1 stale'
      - series: 'cnpg_dba_sync_eligible_replicas{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaPostgresReadyInstancesBelowExpected
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              severity: warning
              dba_cluster: pg-a
            exp_annotations: &id002
              summary: PostgreSQL Ready 实例数低于期望值
              description: 核对 Cluster.spec.instances、Pod Ready、调度及存储；仍有同步备库不代表三实例冗余完整。
      - eval_time: 5m
        alertname: DbaPostgresInstanceMetricsMissing
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              pod: pg-a-3
              uid: uid-3
              severity: warning
              dba_cluster: pg-a
            exp_annotations: *id001
      - eval_time: 5m
        alertname: DbaPostgresNoSynchronousReplica
        exp_alerts: []
  - name: Pod 从独立清单删除后仍须报告副本不足
    interval: 1m
    input_series:
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",condition="true"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '0+0x12'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",uid="uid-2"}'
        values: '1+0x12'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-2",uid="uid-2"}'
        values: '1+0x12'
      - series: 'cnpg_pg_replication_in_recovery{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3",uid="uid-3"}'
        values: '1 1 stale'
      - series: 'up{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-3",uid="uid-3"}'
        values: '1 1 stale'
      - series: 'cnpg_dba_sync_eligible_replicas{job="cnpg-postgres",namespace="dba-a",cluster="pg-a",pod="pg-a-1",uid="uid-1"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaPostgresReadyInstancesBelowExpected
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              severity: warning
              dba_cluster: pg-a
            exp_annotations: *id002
  - name: 独立清单采集丢失不能显示实例健康
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 7m
        alertname: DbaPostgresInstanceInventoryAbsent
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              severity: critical
              dba_cluster: pg-a
            exp_annotations:
              summary: PostgreSQL 独立实例清单缺失
              description: 检查 kube-state-metrics、Pod 标签允许列表及 API 发现；清单缺失不能解释为没有待监控实例。
      - eval_time: 7m
        alertname: DbaPostgresReadyInstancesBelowExpected
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              severity: warning
              dba_cluster: pg-a
            exp_annotations: *id002
  - name: 正在删除的 Pod 不计入 Ready 冗余
    interval: 1m
    input_series:
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-1",uid="uid-1",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-2",uid="uid-2",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_labels{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",label_cnpg_io_cluster="pg-a",label_cnpg_io_pod_role="instance"}'
        values: '1+0x12'
      - series: 'kube_pod_status_ready{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3",condition="true"}'
        values: '1+0x12'
      - series: 'kube_pod_deletion_timestamp{job="kube-state-metrics",namespace="dba-a",pod="pg-a-3",uid="uid-3"}'
        values: '1+0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaPostgresReadyInstancesBelowExpected
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              severity: warning
              dba_cluster: pg-a
            exp_annotations: *id002
