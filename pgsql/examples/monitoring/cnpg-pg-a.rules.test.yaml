            exp_annotations: &id009
              summary: DBA 值班通知送达回执指标缺失
              description: 核查最终接收端和回执采集；没有回执时不能标记通知链路通过。
  - name: 其他渠道回执不能掩盖值班渠道缺失
    interval: 1m
    input_series:
      - series: 'dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="other"}'
        values: '1+60x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaNotificationDeliveryMissing
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              receiver: dba-oncall
              severity: critical
              dba_cluster: pg-a
            exp_annotations: *id009
  - name: 通知回执 零值 不得作为送达证明
    interval: 1m
    input_series:
      - series: 'dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="dba-oncall"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaNotificationDeliveryInvalid
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              receiver: dba-oncall
              severity: critical
              dba_cluster: pg-a
            exp_annotations: &id010
              summary: DBA 通知送达回执时间无效
              description: 核查最终送达凭据与时钟；零值、NaN 或未来时间不能证明通知送达。
  - name: 通知回执 未来时间 不得作为送达证明
    interval: 1m
    input_series:
      - series: 'dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="dba-oncall"}'
        values: '10000+0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaNotificationDeliveryInvalid
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              receiver: dba-oncall
              severity: critical
              dba_cluster: pg-a
            exp_annotations: *id010
  - name: 通知回执 NaN 不得作为送达证明
    interval: 1m
    input_series:
      - series: 'dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="dba-oncall"}'
        values: 'NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaNotificationDeliveryInvalid
        exp_alerts:
          - exp_labels:
              namespace: dba-a
              cluster: pg-a
              receiver: dba-oncall
              severity: critical
              dba_cluster: pg-a
            exp_annotations: *id010
  - name: Prometheus 没有发现 Alertmanager
    interval: 1m
    input_series:
      - series: 'prometheus_notifications_alertmanagers_discovered{job="prometheus",instance="prom-1"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaPrometheusAlertmanagerUnavailable
        exp_alerts:
          - exp_labels:
              job: prometheus
              instance: prom-1
              severity: critical
            exp_annotations:
              summary: Prometheus 没有发现可用 Alertmanager
              description: 检查发现、配置、TLS 与网络；应通过独立通道升级监控链路故障。
  - name: Prometheus 发送错误须告警
    interval: 1m
    input_series:
      - series: 'prometheus_notifications_errors_total{job="prometheus",instance="prom-1",alertmanager="am-1"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaPrometheusNotificationErrors
        exp_alerts:
          - exp_labels:
              job: prometheus
              instance: prom-1
              severity: critical
            exp_annotations:
              summary: Prometheus 向 Alertmanager 发送告警失败
              description: 核查发送错误、排队与接收端；规则 firing 不代表通知送达。
  - name: Alertmanager 渠道失败须告警
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",instance="am-1",integration="webhook"}'
        values: '0+1x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaAlertmanagerNotificationFailures
        exp_alerts:
          - exp_labels:
              job: alertmanager
              instance: am-1
              integration: webhook
              severity: critical
            exp_annotations:
              summary: Alertmanager 向通知渠道发送失败
              description: 检查渠道权限、限流、TLS、重试和备用路由；成功 HTTP 响应仍不等于最终值班端已收到。
  - name: Alertmanager 配置未加载须告警
    interval: 1m
    input_series:
      - series: 'alertmanager_config_last_reload_successful{job="alertmanager",instance="am-1"}'
        values: '0+0x12'
    alert_rule_test:
      - eval_time: 5m
        alertname: DbaAlertmanagerConfigReloadFailed
        exp_alerts:
          - exp_labels:
              job: alertmanager
              instance: am-1
              severity: critical
            exp_annotations:
              summary: Alertmanager 最近一次配置加载失败
              description: 核对实际生效配置、路由与接收方，不能按未加载的新配置判断通知正常。
  - name: 通知链路自监控缺失和持续心跳均须可见
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 7m
        alertname: DbaPrometheusNotificationMetricsAbsent
        exp_alerts:
          - exp_labels:
              job: prometheus
              severity: critical
            exp_annotations:
              summary: Prometheus 通知链路指标缺失
              description: 检查自监控采集，并通过外部心跳检查排除整个监控栈不可用。
      - eval_time: 7m
        alertname: DbaAlertmanagerMetricsAbsent
        exp_alerts:
          - exp_labels:
              job: alertmanager
              severity: critical
            exp_annotations:
              summary: Alertmanager 自监控指标缺失
              description: 检查进程、发现与抓取，并核对独立心跳接收端。
      - eval_time: 7m
        alertname: DbaNotificationWatchdog
        exp_alerts:
          - exp_labels:
              severity: none
              namespace: dba-a
              cluster: pg-a
              dba_cluster: pg-a
              receiver: dba-oncall
            exp_annotations:
              summary: DBA 通知链路持续心跳
              description: 最终接收端确认送达后记录时间；不得由规则计算时间替代回执。
