# dba_* 由平台既有写探测与接收端回执采集提供，不是 CNPG 内置指标。
# 采集端不得把指标抓取时间作为提交、探测或通知送达时间。
groups:
  - name: dba.service-evidence-pg-a
    interval: 30s
    rules:
      - alert: DbaPostgresWriteProbeFailed
        expr: dba_postgres_write_probe_success{namespace="dba-a",cluster="pg-a",probe="rw"} == 0
        for: 1m
        labels:
          severity: critical
          dba_cluster: pg-a
        annotations:
          summary: 业务写入口事务探针持续失败
          description: 检查客户端路径、TLS、提交与读回；TCP 连通、Pod Ready 或 SELECT 1 不能代替成功提交。
      - alert: DbaPostgresWriteProbeNoRecentSuccess
        expr: time() - dba_postgres_write_probe_last_success_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"} > 60
        for: 30s
        labels:
          severity: critical
          dba_cluster: pg-a
        annotations:
          summary: 业务写入口超过一分钟没有成功事务证据
          description: 核查最后成功提交、探针失败或停止；未成功时必须保留零值，不能改写为当前时间。
      - alert: DbaPostgresWriteProbeStale
        expr: time() - dba_postgres_write_probe_last_attempt_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"} > 120
        for: 30s
        labels:
          severity: critical
          dba_cluster: pg-a
        annotations:
          summary: 业务写入探针停止更新
          description: 检查探针调度、执行超时与证据输出；缓存的成功值不能作为当前可写证明。
      - alert: DbaPostgresWriteProbeMetricsAbsent
        expr: |
          absent_over_time(dba_postgres_write_probe_success{namespace="dba-a",cluster="pg-a",probe="rw"}[2m])
          or absent_over_time(dba_postgres_write_probe_last_attempt_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"}[2m])
          or absent_over_time(dba_postgres_write_probe_last_success_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"}[2m])
        for: 30s
        labels:
          severity: critical
          dba_cluster: pg-a
        annotations:
          summary: 业务写入探针指标不完整
          description: 三项指标均需持续暴露；核查探针和采集，不把缺失或失败解释为可写。
      - alert: DbaPostgresWriteProbeInvalid
        expr: |
          ((dba_postgres_write_probe_success{namespace="dba-a",cluster="pg-a",probe="rw"} != 0)
           and (dba_postgres_write_probe_success{namespace="dba-a",cluster="pg-a",probe="rw"} != 1))
          or (dba_postgres_write_probe_last_attempt_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"} <= 0)
          or (dba_postgres_write_probe_last_attempt_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"} > time() + 60)
          or (dba_postgres_write_probe_last_attempt_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"} != dba_postgres_write_probe_last_attempt_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"})
          or (dba_postgres_write_probe_last_success_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"} < 0)
          or (dba_postgres_write_probe_last_success_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"} > time() + 60)
          or (dba_postgres_write_probe_last_success_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"} != dba_postgres_write_probe_last_success_timestamp_seconds{namespace="dba-a",cluster="pg-a",probe="rw"})
        for: 1m
        labels:
          severity: critical
          dba_cluster: pg-a
        annotations:
          summary: 业务写入探针证据值无效
          description: success 只能为 0 或 1；核对时间戳、时钟及采集契约，禁止用未来时间延长健康状态。
  - name: dba.notification-evidence
    interval: 30s
    rules:
      - alert: DbaPrometheusAlertmanagerUnavailable
        expr: prometheus_notifications_alertmanagers_discovered{job="prometheus"} < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Prometheus 没有发现可用 Alertmanager
          description: 检查发现、配置、TLS 与网络；应通过独立通道升级监控链路故障。
      - alert: DbaPrometheusNotificationErrors
        expr: sum by(job,instance) (increase(prometheus_notifications_errors_total{job="prometheus"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Prometheus 向 Alertmanager 发送告警失败
          description: 核查发送错误、排队与接收端；规则 firing 不代表通知送达。
      - alert: DbaPrometheusNotificationMetricsAbsent
        expr: absent_over_time(prometheus_notifications_alertmanagers_discovered{job="prometheus"}[5m])
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Prometheus 通知链路指标缺失
          description: 检查自监控采集，并通过外部心跳检查排除整个监控栈不可用。
      - alert: DbaAlertmanagerNotificationFailures
        expr: sum by(job,instance,integration) (increase(alertmanager_notifications_failed_total{job="alertmanager"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Alertmanager 向通知渠道发送失败
          description: 检查渠道权限、限流、TLS、重试和备用路由；成功 HTTP 响应仍不等于最终值班端已收到。
      - alert: DbaAlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Alertmanager 最近一次配置加载失败
          description: 核对实际生效配置、路由与接收方，不能按未加载的新配置判断通知正常。
      - alert: DbaAlertmanagerMetricsAbsent
        expr: absent_over_time(alertmanager_config_last_reload_successful{job="alertmanager"}[5m])
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Alertmanager 自监控指标缺失
          description: 检查进程、发现与抓取，并核对独立心跳接收端。
      # 持续 firing，由实际值班路由每分钟重复发送；接收端独立检查超时。
      - alert: DbaNotificationWatchdog
        expr: vector(1)
        labels:
          severity: none
          namespace: dba-a
          cluster: pg-a
          dba_cluster: pg-a
          receiver: dba-oncall
        annotations:
          summary: DBA 通知链路持续心跳
          description: 最终接收端确认送达后记录时间；不得由规则计算时间替代回执。
      - alert: DbaNotificationDeliveryStale
        expr: time() - dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="dba-oncall"} > 300
        for: 1m
        labels:
          severity: critical
          dba_cluster: pg-a
        annotations:
          summary: DBA 值班渠道超过五分钟未确认收到心跳
          description: 从最终接收方核对路由、抑制、静默和渠道故障；使用独立通知路径升级。
      - alert: DbaNotificationDeliveryMissing
        expr: absent_over_time(dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="dba-oncall"}[5m])
        for: 1m
        labels:
          severity: critical
          dba_cluster: pg-a
        annotations:
          summary: DBA 值班通知送达回执指标缺失
          description: 核查最终接收端和回执采集；没有回执时不能标记通知链路通过。
      - alert: DbaNotificationDeliveryInvalid
        expr: |
          (dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="dba-oncall"} <= 0)
          or (dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="dba-oncall"} > time() + 60)
          or (dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="dba-oncall"} != dba_alert_notification_last_received_timestamp_seconds{namespace="dba-a",cluster="pg-a",receiver="dba-oncall"})
        for: 1m
        labels:
          severity: critical
          dba_cluster: pg-a
        annotations:
          summary: DBA 通知送达回执时间无效
          description: 核查最终送达凭据与时钟；零值、NaN 或未来时间不能证明通知送达。
